<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RT Car — Gestão de Vendas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f5f0;--bg2:#fff;--bg3:#f0ede6;--tx:#1a1814;--tx2:#5a5650;--tx3:#8a867e;--red:#c8381c;--redl:#fdf0ec;--gold:#b8860b;--goldl:#faf6e8;--green:#1a6b3c;--greenl:#e8f5ee;--blue:#1e4d8c;--bluel:#e8f0fb;--bdr:#e0dbd2;--r:10px;--r2:14px;--f:'DM Sans',sans-serif;--s:'DM Serif Display',serif}
body{font-family:var(--f);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;height:100vh;overflow:hidden}
.wrap{display:flex;height:100vh;overflow:hidden}
.sb{width:210px;background:var(--tx);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.cnt{flex:1;overflow-y:auto;padding:22px}
.logo{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo-t{font-family:var(--s);font-size:21px;color:#fff}
.logo-s{font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.nav{flex:1;padding:8px 0}
.ni{display:flex;align-items:center;gap:8px;padding:9px 18px;cursor:pointer;color:rgba(255,255,255,.5);font-size:13px;border-left:2px solid transparent;transition:all .12s}
.ni:hover{color:#fff;background:rgba(255,255,255,.05)}
.ni.on{color:#fff;background:rgba(200,56,28,.15);border-left-color:var(--red)}
.sb-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1)}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0}
.tb{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:0 22px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:var(--f);transition:all .12s;line-height:1}
.p{background:var(--red);color:#fff}.p:hover{background:#e8572e}
.s{background:var(--bg2);color:var(--tx);border:1px solid var(--bdr)}.s:hover{background:var(--bg3)}
.g{background:none;color:var(--tx2);border:1px solid transparent}.g:hover{background:var(--bg3)}
.ok{background:var(--greenl);color:var(--green);border:1px solid rgba(26,107,60,.2)}.ok:hover{background:var(--green);color:#fff}
.no{background:var(--redl);color:var(--red);border:1px solid rgba(200,56,28,.2)}.no:hover{background:var(--red);color:#fff}
.sm{padding:4px 10px;font-size:12px}.xs{padding:2px 7px;font-size:11px}
.nb{position:relative;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:5px 9px;cursor:pointer;font-size:14px;color:var(--tx2)}
.ndot{position:absolute;top:2px;right:2px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--bg2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500}
.bp{background:var(--goldl);color:var(--gold)}.ba{background:var(--greenl);color:var(--green)}.br{background:var(--redl);color:var(--red)}.bd{background:var(--bg3);color:var(--tx3)}
.badm{background:var(--tx);color:#fff}.bman{background:var(--bluel);color:var(--blue)}.bsel{background:var(--bg3);color:var(--tx2)}
.card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:18px}
.mts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.mt{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:16px;position:relative;overflow:hidden}
.mt::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%}
.mt.bl::before{background:var(--blue)}.mt.gr::before{background:var(--green)}.mt.go::before{background:var(--gold)}.mt.re::before{background:var(--red)}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;padding:8px 11px;text-align:left;background:var(--bg3);border-bottom:1px solid var(--bdr)}
td{padding:10px 11px;border-bottom:1px solid var(--bdr);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.cr:hover td{background:var(--bg3);cursor:pointer}
code{font-size:10px;background:var(--bg3);padding:2px 5px;border-radius:3px;font-family:monospace}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:10px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px}
.fl input,.fl select,.fl textarea{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:var(--f);color:var(--tx);outline:none;transition:border-color .12s}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,56,28,.08)}
.fl input.e,.fl select.e{border-color:var(--red);background:#fff8f6}
.fl textarea{resize:vertical;min-height:64px}
.rg{display:flex;gap:10px}
.ro{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:var(--tx2)}
.ro input{accent-color:var(--red)}
.req{color:var(--red);font-size:10px}
hr.dv{border:none;border-top:1px solid var(--bdr);margin:18px 0}
.al{border-radius:var(--r);padding:10px 13px;font-size:13px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px}
.aw{background:var(--goldl);border:1px solid rgba(184,134,11,.2);color:#7a5a00}
.ai{background:var(--bluel);border:1px solid rgba(30,77,140,.2);color:var(--blue)}
.aok{background:var(--greenl);border:1px solid rgba(26,107,60,.2);color:var(--green)}
.steps{display:flex;align-items:center;margin-bottom:20px}
.si{display:flex;align-items:center;flex:1}
.sd{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.dn{background:var(--green);color:#fff}.ac{background:var(--red);color:#fff}.td{background:var(--bg3);color:var(--tx3)}
.sl{flex:1;height:1px;background:var(--bdr);margin:0 5px}.sldn{background:var(--green)}
.vc{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px}
.vch{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.add{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px dashed var(--bdr);border-radius:var(--r);cursor:pointer;font-size:12px;color:var(--tx2);background:none;font-family:var(--f);width:100%;margin-top:4px;transition:all .12s}
.add:hover{border-color:var(--red);color:var(--red);background:var(--redl)}
.np{position:absolute;right:0;top:0;width:320px;height:100%;background:var(--bg2);border-left:1px solid var(--bdr);z-index:200;display:flex;flex-direction:column;box-shadow:-4px 0 16px rgba(0,0,0,.08)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:var(--bg2);border-radius:var(--r2);padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.pov{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:300;overflow-y:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.pfr{background:#fff;width:680px;max-width:100%;border-radius:8px;overflow:hidden}
.phd{background:var(--red);padding:16px 24px;display:flex;justify-content:space-between;align-items:flex-start}
.psh{background:#1a1814;padding:4px 8px;border-radius:3px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#fff;margin-bottom:8px}
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.pg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 14px}
.pf{border-bottom:1px solid #e0dbd2;padding-bottom:5px}
.pfl{font-size:8px;text-transform:uppercase;letter-spacing:.3px;color:#8a867e;margin-bottom:1px}
.pfv{font-size:11px;font-weight:500}
.pfv.big{font-size:13px;font-weight:700;color:var(--red)}
.lw{display:flex;min-height:100vh;width:100%}
.ll{flex:1;background:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.lr{width:400px;display:flex;align-items:center;justify-content:center;padding:36px;background:var(--bg)}
.lc{width:100%;max-width:320px}
.tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:18px}
.tab{padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{color:var(--tx)}.tab.on{color:var(--red);border-bottom-color:var(--red)}
.db{background:var(--bg3);border-radius:var(--r);padding:12px;margin-bottom:12px}
.dbt{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin-bottom:8px}
.dg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.df{display:flex;flex-direction:column;gap:2px}
.dfl{font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--tx3)}
.dfv{font-size:13px;font-weight:500}
.dfv.big{font-size:14px;font-weight:600}
.tli{display:flex;gap:10px;padding-bottom:12px;position:relative}
.tli:not(:last-child)::after{content:'';position:absolute;left:9px;top:20px;width:1px;height:calc(100% - 4px);background:var(--bdr)}
.tld{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;z-index:1;flex-shrink:0}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
</style>
</head>
<body>
<div id="R" style="position:relative;height:100vh"></div>
<script>
const ORIGENS=['Facebook','Instagram','Telefone (Meta)','Google','OLX','Mercado Livre','Webmotors','Mobiauto','Na Pista','LitoralCar','ItaúCarros','Passantes','My Business (Postagens Particulares)','Carteira'];
const RL={admin:'Administrador',manager:'Gestão',seller:'Vendedor'};
const RC={admin:'#c8381c',manager:'#1e4d8c',seller:'#1a6b3c'};
const $=id=>document.getElementById(id);
const ini=n=>(n||'').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()||'??';
const ts=()=>new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const td=()=>new Date().toLocaleDateString('pt-BR');
const nId=()=>'TRM-'+String(G.T.length+1).padStart(3,'0');
const sbdg=s=>{const m={pending:['bp','Pendente'],approved:['ba','Aprovado'],rejected:['br','Recusado'],draft:['bd','Rascunho']};const[c,l]=m[s]||['bd',s];return`<span class="bdg ${c}">${l}</span>`;};
const eSV=()=>({m:'',yf:'',ym:'',c:'',km:'',pl:'',pr:'',ip:'comprador',tr:'comprador'});
const eTV=()=>({m:'',yf:'',ym:'',c:'',km:'',pl:'',v:'',fi:'',av:'',bk:'',po:'',ip:'comprador'});
let G={
  u:null,pg:'db',sid:null,no:false,mo:null,pid:null,tab:'all',
  U:[
    {id:1,n:'Marcela Admin',e:'marcela@rtcar.com.br',p:'RTCar@2025!',r:'admin'},
    {id:2,n:'Rafael Gonçalves',e:'rafael@rtcar.com.br',p:'Rafael@2025!',r:'manager'},
    {id:3,n:'Carlos Vendas',e:'carlos@rtcar.com.br',p:'Carlos@123',r:'seller'},
  ],
  T:[
    {id:'TRM-001',dt:'10/04/2025',og:'Passantes',by:'João da Silva',ph:'(47) 99888-7766',
     sv:[{m:'Honda Civic EXL',yf:'2022',ym:'2023',c:'Prata',km:'32.000 km',pl:'ABC-1234',pr:'R$ 112.000',ip:'comprador',tr:'rtcar'}],
     tv:[],py:{vo:'R$ 25.000',hf:true,fb:'Bradesco',fv:'R$ 87.000',fp:'60',fpv:'R$ 1.950,00',ft:'1,2%',fvc:'05/06/2025',ob:''},
     st:'approved',cr:3,ab:2,at:'11/04/2025 09:15',
     lg:[{a:'Criado e enviado para aprovação',u:'Carlos Vendas',t:'10/04/2025 14:22'},{a:'Aprovado por Rafael Gonçalves',u:'Rafael Gonçalves',t:'11/04/2025 09:15'}]},
    {id:'TRM-002',dt:'15/04/2025',og:'Instagram',by:'Maria Fernanda Costa',ph:'(47) 98765-4321',
     sv:[{m:'Toyota Corolla XEI',yf:'2023',ym:'2023',c:'Branco',km:'12.500 km',pl:'XYZ-5678',pr:'R$ 145.000',ip:'rtcar',tr:'comprador'}],
     tv:[{m:'Fiat Argo Drive',yf:'2020',ym:'2020',c:'Vermelho',km:'58.000 km',pl:'DEF-9012',v:'R$ 55.000',fi:'R$ 62.000',av:'R$ 55.000',bk:'Itaú',po:'R$ 8.500',ip:'comprador'}],
     py:{vo:'',hf:false,fb:'',fv:'',fp:'',fpv:'',ft:'',fvc:'',ob:'Pagamento entrada + troca'},
     st:'pending',cr:3,ab:null,at:null,
     lg:[{a:'Criado e enviado para aprovação',u:'Carlos Vendas',t:'15/04/2025 10:45'}]},
  ],
  N:[
    {id:1,msg:'🚗 Novo Termo TRM-002 aguardando aprovação — Maria Fernanda Costa',t:'15/04 10:45',r:false,tid:'TRM-002'},
    {id:2,msg:'✅ Termo TRM-001 aprovado.',t:'11/04 09:15',r:true,tid:'TRM-001'},
  ],
  nf:null,ns:0,auO:false,auF:{n:'',e:'',p:'',r:'seller'},
};
const cA=()=>G.u&&(G.u.r==='manager'||G.u.r==='admin');
const cC=()=>G.u&&(G.u.r==='seller'||G.u.r==='admin');
const isR=()=>G.u&&(G.u.id===2||G.u.r==='admin');
const unr=()=>G.N.filter(n=>!n.r).length;
function re(){$('R').innerHTML=bA();bi();}
function go(p,id){G.pg=p;if(id!==undefined)G.sid=id;G.no=false;G.pid=null;re();}
function bA(){if(!G.u)return bLg();return`<div class="wrap">${bSB()}<div class="main">${bTB()}<div class="cnt">${bPg()}</div>${G.no?bNP():''}${G.mo?bMo():''}${G.pid?bPDF():''}</div></div>`;}
function bLg(){return`<div class="lw"><div class="ll"><div style="font-family:var(--s);font-size:44px;color:#fff;margin-bottom:8px">RT Car</div><p style="color:rgba(255,255,255,.4);font-size:13px;text-align:center;max-width:240px;line-height:1.6">Sistema de Gestão de Vendas Interno</p><div style="margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:260px">${[['14 Origens','Facebook, Insta...'],['Múlt. Veículos','Venda e trocas'],['Aprovação','Rafael Gonçalves'],['PDF','Pré-visualização']].map(([t,s])=>`<div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px"><div style="color:#fff;font-size:11px;font-weight:500">${t}</div><div style="color:rgba(255,255,255,.3);font-size:10px;margin-top:1px">${s}</div></div>`).join('')}</div></div><div class="lr"><div class="lc"><h2 style="font-size:20px;font-weight:600;margin-bottom:4px">Bem-vindo</h2><p style="color:var(--tx2);font-size:13px;margin-bottom:20px">Acesse com suas credenciais</p><div id="le" style="display:none;background:var(--redl);border:1px solid rgba(200,56,28,.2);color:var(--red);padding:8px 11px;border-radius:var(--r);font-size:13px;margin-bottom:12px"></div><div class="fl" style="margin-bottom:12px"><label>E-mail</label><input id="lem" type="email" style="background:var(--bg2);padding:10px 11px" value="marcela@rtcar.com.br"></div><div class="fl" style="margin-bottom:16px"><label>Senha</label><input id="lpw" type="password" style="background:var(--bg2);padding:10px 11px" value="RTCar@2025!"></div><button class="btn p" style="width:100%;justify-content:center;padding:10px" id="lbt">→ Entrar</button><div style="margin-top:16px;background:#f0ede6;border-radius:8px;padding:10px;font-size:11px;color:#8a867e"><div style="font-weight:600;margin-bottom:5px;color:#5a5650">Acesso rápido:</div>${G.U.map(u=>`<div style="margin-bottom:3px;cursor:pointer;color:#5a5650" onclick="$('lem').value='${u.e}';$('lpw').value='${u.p}';dL()">▸ ${u.e} (${RL[u.r]})</div>`).join('')}</div></div></div></div>`;}
function dL(){const e=$('lem').value.trim(),p=$('lpw').value;const u=G.U.find(u=>u.e===e&&u.p===p);if(!u){$('le').textContent='E-mail ou senha incorretos.';$('le').style.display='block';return;}G.u=u;go('db');}
function bSB(){const u=G.u;const ns=[{id:'db',i:'▣',l:'Dashboard'},{id:'tl',i:'≡',l:'Termos de Venda'},...(cC()?[{id:'nv',i:'+',l:'Nova Venda'}]:[]),...(u.r==='admin'?[{id:'us',i:'◉',l:'Usuários'}]:[]),{id:'pr',i:'⊙',l:'Meu Perfil'}];return`<div class="sb"><div class="logo"><div class="logo-t">RT Car</div><div class="logo-s">Gestão de Vendas</div></div><nav class="nav">${ns.map(n=>`<div class="ni${G.pg===n.id?' on':''}" onclick="go('${n.id}')"><span style="width:15px;text-align:center;font-size:13px">${n.i}</span>${n.l}</div>`).join('')}</nav><div class="sb-foot"><div style="display:flex;align-items:center;gap:8px"><div class="av" style="background:${RC[u.r]||'#888'}">${ini(u.n)}</div><div style="min-width:0;flex:1"><div style="font-size:11px;color:rgba(255,255,255,.8);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.n.split(' ').slice(0,2).join(' ')}</div><div style="font-size:9px;color:rgba(255,255,255,.3)">${RL[u.r]}</div></div><button style="background:none;border:none;color:rgba(255,255,255,.2);cursor:pointer;font-size:14px" onclick="G.u=null;re()">⏻</button></div></div></div>`;}

function bS0(f){return`<div style="font-family:var(--s);font-size:18px;margin-bottom:14px">Informações Gerais</div><div class="g2"><div class="fl"><label>Data</label><input type="date" value="${f.dt}" onchange="G.nf.dt=this.value"></div><div class="fl"><label>Origem <span class="req">*</span></label><select onchange="G.nf.og=this.value" class="${!f.og?'e':''}"><option value="">Selecione a origem...</option>${ORIGENS.map(o=>`<option value="${o}"${f.og===o?' selected':''}>${o}</option>`).join('')}</select></div><div class="fl full"><label>Nome do Comprador <span class="req">*</span></label><input value="${f.by}" oninput="G.nf.by=this.value" placeholder="Nome completo" class="${!f.by.trim()?'e':''}"></div><div class="fl"><label>Telefone <span class="req">*</span></label><input value="${f.ph}" oninput="G.nf.ph=this.value" placeholder="(47) 9XXXX-XXXX" class="${!f.ph.trim()?'e':''}"></div></div>`;}
function bS1(f){return`<div style="font-family:var(--s);font-size:18px;margin-bottom:14px">Veículos Vendidos</div>${f.sv.map((v,i)=>`<div class="vc"><div class="vch"><span style="color:var(--red)">Veículo ${i+1}${f.sv.length>1?' de '+f.sv.length:''}</span>${f.sv.length>1?`<button class="btn no xs" onclick="G.nf.sv.splice(${i},1);re()">✕ Remover</button>`:''}</div><div class="g2"><div class="fl full"><label>Modelo / Marca <span class="req">*</span></label><input value="${v.m}" oninput="G.nf.sv[${i}].m=this.value" placeholder="Ex: Honda Civic EXL" class="${!v.m?'e':''}"></div><div class="fl"><label>Valor de Venda <span class="req">*</span></label><input value="${v.pr}" oninput="G.nf.sv[${i}].pr=this.value" placeholder="R$ 0,00" class="${!v.pr?'e':''}"></div><div class="fl"><label>Cor <span class="req">*</span></label><input value="${v.c}" oninput="G.nf.sv[${i}].c=this.value" placeholder="Prata, Branco..." class="${!v.c?'e':''}"></div><div class="fl"><label>Quilometragem <span class="req">*</span></label><input value="${v.km}" oninput="G.nf.sv[${i}].km=this.value" placeholder="0 km" class="${!v.km?'e':''}"></div><div class="fl"><label>Ano Fabricação <span class="req">*</span></label><input value="${v.yf}" oninput="G.nf.sv[${i}].yf=this.value" placeholder="2023" class="${!v.yf?'e':''}"></div><div class="fl"><label>Ano Modelo <span class="req">*</span></label><input value="${v.ym}" oninput="G.nf.sv[${i}].ym=this.value" placeholder="2024" class="${!v.ym?'e':''}"></div><div class="fl"><label>Placa <span class="req">*</span></label><input value="${v.pl}" oninput="G.nf.sv[${i}].pl=this.value" placeholder="ABC-1234" class="${!v.pl?'e':''}"></div></div><div class="g2" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)"><div class="fl"><label>IPVA 2026</label><div class="rg"><label class="ro"><input type="radio" name="ip${i}" ${v.ip==='comprador'?'checked':''} onchange="G.nf.sv[${i}].ip='comprador'">Comprador</label><label class="ro"><input type="radio" name="ip${i}" ${v.ip==='rtcar'?'checked':''} onchange="G.nf.sv[${i}].ip='rtcar'">RT Car</label></div></div><div class="fl"><label>Transferência</label><div class="rg"><label class="ro"><input type="radio" name="tr${i}" ${v.tr==='comprador'?'checked':''} onchange="G.nf.sv[${i}].tr='comprador'">Comprador</label><label class="ro"><input type="radio" name="tr${i}" ${v.tr==='rtcar'?'checked':''} onchange="G.nf.sv[${i}].tr='rtcar'">RT Car</label></div></div></div></div>`).join('')}<button class="add" onclick="G.nf.sv.push(eSV());re()">+ Adicionar outro veículo vendido</button>`;}

prador'?'checked':''} onchange="G.nf.tv[${i}].ip='comprador'">Comprador</label><label class="ro"><input type="radio" name="tvi${i}" ${v.ip==='rtcar'?'checked':''} onchange="G.nf.tv[${i}].ip='rtcar'">RT Car</label></div></div></div></div>`).join('')}<button class="add" onclick="G.nf.tv.push(eTV());re()">+ Adicionar veículo de troca</button>`;}
function bS3(f){const p=f.py;return`<div style="font-family:var(--s);font-size:18px;margin-bottom:14px">Formas de Pagamento</div><div class="g2"><div class="fl full"><label>Valor da Volta / Pagamento</label><input value="${p.vo}" oninput="G.nf.py.vo=this.value" placeholder="R$ 0,00 ou descreva..."></div></div><label style="display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--bg3);border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;margin:12px 0"><input type="checkbox" ${p.hf?'checked':''} onchange="G.nf.py.hf=this.checked;re()" style="accent-color:var(--red);width:14px;height:14px">Inclui financiamento</label>${p.hf?`<div class="g2"><div class="fl"><label>Banco</label><input value="${p.fb}" oninput="G.nf.py.fb=this.value" placeholder="Bradesco, Itaú..."></div><div class="fl"><label>Valor Financiado</label><input value="${p.fv}" oninput="G.nf.py.fv=this.value" placeholder="R$ 0,00"></div><div class="fl"><label>Nº de Parcelas</label><input value="${p.fp}" oninput="G.nf.py.fp=this.value" placeholder="48"></div><div class="fl"><label>Valor da Parcela</label><input value="${p.fpv}" oninput="G.nf.py.fpv=this.value" placeholder="R$ 0,00"></div><div class="fl"><label>Taxa</label><input value="${p.ft}" oninput="G.nf.py.ft=this.value" placeholder="1,2%"></div><div class="fl"><label>Vencimento 1ª Parcela</label><input value="${p.fvc}" oninput="G.nf.py.fvc=this.value" placeholder="dd/mm/aaaa"></div></div>`:''}<div class="fl" style="margin-top:12px"><label>Observações</label><textarea oninput="G.nf.py.ob=this.value" placeholder="Condições especiais...">${p.ob}</textarea></div><div class="al aw" style="margin-top:12px;margin-bottom:0"><span>ℹ</span><div>Este Termo será enviado para <strong>Rafael Gonçalves</strong> aprovar.</div></div>`;}
function nS(){const f=G.nf,s=G.ns;if(s===0){if(!f.og)return alert('Selecione a Origem.');if(!f.by.trim())return alert('Informe o nome do comprador.');if(!f.ph.trim())return alert('Informe o telefone.');}if(s===1){for(let i=0;i<f.sv.length;i++){const v=f.sv[i];if(!v.m||!v.pr||!v.c||!v.km||!v.yf||!v.ym||!v.pl)return alert('Preencha todos os campos do Veículo '+(i+1)+'.');}}G.ns++;re();}
function sT(){const f=G.nf,id=nId();G.T.unshift({id,dt:f.dt,og:f.og,by:f.by,ph:f.ph,sv:f.sv.map(v=>({...v})),tv:f.tv.map(v=>({...v})),py:{...f.py},st:'pending',cr:G.u.id,ab:null,at:null,lg:[{a:'Criado e enviado para aprovação',u:G.u.n,t:ts()}]});G.N.unshift({id:Date.now(),msg:`🚗 Novo Termo ${id} aguardando aprovação — ${f.by} (por ${G.u.n})`,t:ts().slice(0,11),r:false,tid:id});G.nf.dn=true;G.nf.did=id;re();}
function bMo(){const t=G.T.find(x=>x.id===G.mo);if(!t)return'';const auth=isR();return`<div class="ov" onclick="if(event.target===this){G.mo=null;re();}"><div class="mod"><div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px"><div><div style="font-family:var(--s);font-size:19px">Análise do Termo</div><div style="font-size:11px;color:var(--tx3);margin-top:2px">${t.id} — ${t.by}</div></div><button style="background:none;border:none;font-size:19px;cursor:pointer;color:var(--tx3)" onclick="G.mo=null;re()">×</button></div>${!auth?`<div class="al aw">⚠ Apenas Rafael Gonçalves pode autorizar.</div>`:''}<div style="background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:13px"><span style="color:var(--tx2);font-weight:500">Comprador</span><span style="font-weight:600">${t.by}</span></div>${t.sv.map((v,i)=>`<div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:13px"><span style="color:var(--tx2);font-weight:500">Veículo${t.sv.length>1?' '+(i+1):''}</span><span style="font-weight:600">${v.m} — ${v.pr}</span></div>`).join('')}${t.tv.map((v,i)=>`<div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:13px"><span style="color:var(--tx2);font-weight:500">Troca${t.tv.length>1?' '+(i+1):''}</span><span style="font-weight:600">${v.m} (${v.v})</span></div>`).join('')}</div><div class="fl" style="margin-bottom:14px"><label>Observação (opcional)</label><textarea id="of" placeholder="Motivo da recusa..." style="min-height:56px"></textarea></div><div style="display:flex;gap:7px;justify-content:flex-end"><button class="btn s" onclick="G.mo=null;re()">Cancelar</button>${auth?`<button class="btn no" onclick="dD('${t.id}','rejected')">✗ Recusar</button><button class="btn ok" onclick="dD('${t.id}','approved')">✓ Aprovar</button>`:''}</div></div></div>`;}

">${RL[u.r]||u.r}</span></td></tr>`).join('')}</tbody></table></div></div>`;}
function aU(){const f=G.auF,e=$('aue');if(!f.n||!f.e||!f.p){e.textContent='Preencha todos os campos.';e.style.display='block';return;}if(G.U.find(u=>u.e===f.e)){e.textContent='E-mail já cadastrado.';e.style.display='block';return;}G.U.push({id:Date.now(),n:f.n,e:f.e,p:f.p,r:f.r});G.auF={n:'',e:'',p:'',r:'seller'};G.auO=false;re();}
function bPR(){const u=G.u;return`<div style="max-width:380px"><h1 style="font-family:var(--s);font-size:21px;margin-bottom:18px">Meu Perfil</h1><div class="card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><div class="av" style="background:${RC[u.r]||'#888'};width:52px;height:52px;font-size:17px;border-radius:50%">${ini(u.n)}</div><div><div style="font-size:16px;font-weight:600">${u.n}</div><div style="font-size:11px;color:var(--tx3);margin-top:2px">${u.e}</div></div></div><div class="al ai">ℹ Para alterar senha ou e-mail, contate o administrador.</div></div></div>`;}
function bi(){const lb=$('lbt');if(lb){lb.onclick=dL;['lem','lpw'].forEach(id=>{const el=$(id);if(el)el.onkeydown=e=>{if(e.key==='Enter')dL();};});}}
