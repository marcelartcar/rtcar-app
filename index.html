<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RT Car — Gestão de Vendas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f5;--bg2:#ffffff;--bg3:#f0f0f0;--tx:#1a1814;--tx2:#4a4a4a;--tx3:#888;--red:#e8431e;--redl:#fff0ec;--gold:#b8860b;--goldl:#faf6e8;--green:#1a6b3c;--greenl:#e8f5ee;--blue:#1e4d8c;--bluel:#e8f0fb;--bdr:#e0e0e0;--r:10px;--r2:14px;--f:'DM Sans',sans-serif;--s:'DM Serif Display',serif}
body{font-family:var(--f);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;height:100vh;overflow:hidden}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:220px;background:#fff;border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:16px 18px 14px;border-bottom:1px solid var(--bdr)}
.sb-logo img{width:90px;object-fit:contain}
.nav{flex:1;padding:10px 0;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:10px 18px;cursor:pointer;color:var(--tx2);font-size:13px;border-left:3px solid transparent;transition:all .12s}
.ni:hover{color:var(--red);background:#fff3f0}
.ni.on{color:var(--red);background:#fff3f0;border-left-color:var(--red);font-weight:600}
.sb-foot{padding:13px 16px;border-top:1px solid var(--bdr)}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tb{background:#fff;border-bottom:1px solid var(--bdr);padding:0 22px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cnt{flex:1;overflow-y:auto;padding:22px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:var(--f);transition:all .12s;line-height:1}
.bp{background:var(--red);color:#fff}.bp:hover{background:#c73516}
.bs{background:#fff;color:var(--tx);border:1px solid var(--bdr)}.bs:hover{background:var(--bg3)}
.bg{background:none;color:var(--tx2);border:1px solid transparent}.bg:hover{background:var(--bg3)}
.bok{background:var(--greenl);color:var(--green);border:1px solid rgba(26,107,60,.2)}.bok:hover{background:var(--green);color:#fff}
.bno{background:var(--redl);color:var(--red);border:1px solid rgba(232,67,30,.2)}.bno:hover{background:var(--red);color:#fff}
.bsm{padding:5px 11px;font-size:12px}
.bxs{padding:2px 7px;font-size:11px}
.nb{position:relative;background:#fff;border:1px solid var(--bdr);border-radius:var(--r);padding:6px 10px;cursor:pointer;font-size:14px;color:var(--tx2)}
.ndot{position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid #fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600}
.bpp{background:var(--goldl);color:var(--gold)}.baa{background:var(--greenl);color:var(--green)}.brr{background:var(--redl);color:var(--red)}.bdd{background:var(--bg3);color:var(--tx3)}
.badm{background:#1a1814;color:#fff}.bmst{background:#7c3aed;color:#fff}.bman{background:var(--bluel);color:var(--blue)}.bsel{background:var(--bg3);color:var(--tx2)}
.card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mts{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}
.mt{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:17px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mt::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
.mt.bl::after{background:var(--blue)}.mt.gr::after{background:var(--green)}.mt.go::after{background:var(--gold)}.mt.re::after{background:var(--red)}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;text-align:left;background:var(--bg3);border-bottom:1px solid var(--bdr)}
td{padding:10px 12px;border-bottom:1px solid var(--bdr);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.cr:hover td{background:#fff8f6;cursor:pointer}
code{font-size:11px;background:var(--bg3);padding:2px 6px;border-radius:4px;font-family:monospace;color:var(--red)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
.full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:5px}
.fl label{font-size:10px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px}
.fl input,.fl select,.fl textarea{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 11px;font-size:13px;font-family:var(--f);color:var(--tx);outline:none;transition:border-color .12s;text-transform:uppercase}
.fl input::placeholder,.fl textarea::placeholder{text-transform:none;color:var(--tx3)}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(232,67,30,.08);background:#fff}
.fl input.er,.fl select.er{border-color:var(--red);background:#fff8f6}
.fl textarea{resize:vertical;min-height:70px;text-transform:uppercase}
.fl select{text-transform:none}
.notransform{text-transform:none!important}
.rg{display:flex;gap:10px;flex-wrap:wrap}
.ro{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:var(--tx2)}
.ro input{accent-color:var(--red)}
.req{color:var(--red);font-size:10px}
hr.dv{border:none;border-top:1px solid var(--bdr);margin:18px 0}
.al{border-radius:var(--r);padding:11px 14px;font-size:13px;margin-bottom:12px;display:flex;align-items:flex-start;gap:9px}
.aw{background:#fffbeb;border:1px solid rgba(184,134,11,.25);color:#7a5a00}
.ai{background:var(--bluel);border:1px solid rgba(30,77,140,.2);color:var(--blue)}
.aok{background:var(--greenl);border:1px solid rgba(26,107,60,.2);color:var(--green)}
.mwrap{position:relative}
.mwrap .msym{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--tx3);pointer-events:none;font-weight:500;z-index:1}
.mwrap input{padding-left:32px!important;text-transform:none!important}
.np{position:absolute;right:0;top:0;width:330px;height:100%;background:#fff;border-left:1px solid var(--bdr);z-index:200;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.08)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:#fff;border-radius:var(--r2);padding:26px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.pov{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:300;overflow-y:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.pfr{background:#fff;width:720px;max-width:100%;border-radius:8px;overflow:hidden}
.sb2{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:13px}
.sb2t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sb2t .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.df{display:flex;flex-direction:column;gap:2px}
.dfl{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);font-weight:600}
.dfv{font-size:13px;font-weight:500;color:var(--tx)}
.dfv.big{font-size:15px;font-weight:700;color:var(--red)}
.price-r{text-align:right;font-size:15px;font-weight:700;color:var(--red)}
.tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:18px}
.tab{padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{color:var(--tx)}.tab.on{color:var(--red);border-bottom-color:var(--red)}
.steps{display:flex;align-items:center;margin-bottom:20px}
.si{display:flex;align-items:center;flex:1}
.sd{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.sdn{background:var(--green);color:#fff}.sac{background:var(--red);color:#fff}.std{background:var(--bg3);color:var(--tx3)}
.sl{flex:1;height:1px;background:var(--bdr);margin:0 6px}.sldo{background:var(--green)}
.vc{background:#fff;border:1px solid var(--bdr);border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.vch{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:11px;display:flex;align-items:center;justify-content:space-between}
.addbtn{display:flex;align-items:center;gap:6px;padding:9px 14px;border:1px dashed var(--bdr);border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--tx2);background:none;font-family:var(--f);width:100%;margin-top:6px;transition:all .12s;justify-content:center}
.addBtn:hover{border-color:var(--red);color:var(--red);background:var(--redl)}
.tli{display:flex;gap:10px;padding-bottom:13px;position:relative}
.tli:not(:last-child)::after{content:'';position:absolute;left:10px;top:21px;width:1px;height:calc(100% - 5px);background:var(--bdr)}
.tld{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;z-index:1;flex-shrink:0}
.lw{display:flex;min-height:100vh;width:100%}
.ll{flex:1;background:#1a1814;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.lr{width:420px;display:flex;align-items:center;justify-content:center;padding:36px;background:var(--bg)}
.lc{width:100%;max-width:340px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
</style>
</head>

function onMoney(el, path){
  var raw = el.value.replace(/\D/g,'');
  if(!raw){ el.value=''; setPath(path,''); return; }
  var cents = parseInt(raw, 10);
  var fmt = (cents/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  el.value = fmt;
  setPath(path, fmt);
}
function onDate(el, path){
  var raw = el.value.replace(/\D/g,'').substring(0,8);
  var fmt = raw;
  if(raw.length > 2) fmt = raw.substring(0,2)+'/'+raw.substring(2);
  if(raw.length > 4) fmt = raw.substring(0,2)+'/'+raw.substring(2,4)+'/'+raw.substring(4);
  el.value = fmt;
  setPath(path, fmt);
}

function setPath(path, val){
  var parts = path.split('.');
  var obj = G;
  for(var i=0;i<parts.length-1;i++){
    if(obj[parts[i]]===undefined) return;
    obj = obj[parts[i]];
  }
  obj[parts[parts.length-1]] = val;
}

function startEdit(id){
  var t=G.T.find(function(x){return x.id===id;});
  if(!t||t.locked){alert('Este termo foi aprovado e não pode ser editado.');return;}
  G.nf=JSON.parse(JSON.stringify(t));
  G.nf.editMode=true; G.nf.editId=id; G.nf.dn=false;
  G.ns=0; go('nv');
}
function saveEdit(){
  var f=G.nf;
  var idx=G.T.findIndex(function(x){return x.id===f.editId;});
  if(idx<0) return;
  var orig=G.T[idx];
  var updated=JSON.parse(JSON.stringify(f));
  updated.editMode=false; updated.editId=undefined;
  updated.lg=orig.lg.concat([{a:'Termo editado',u:G.u.n,t:ts()}]);
  G.T[idx]=updated;
  G.nf=null; G.ns=0; go('dt',orig.id);
}

function bNV(){
  if(!G.nf) iNF();
  if(G.nf.dn){
    var did=G.nf.did||G.nf.editId;
    return '<div class="card" style="text-align:center;padding:44px 24px"><div style="font-size:48px;margin-bottom:14px">✅</div><h2 style="font-family:var(--s);font-size:22px;margin-bottom:8px">Termo '+(G.nf.editMode?'atualizado':'enviado')+'!</h2><p style="color:var(--tx2);margin-bottom:4px">ID: <strong>'+did+'</strong></p><p style="color:var(--tx3);font-size:12px;margin-bottom:24px">'+(G.nf.editMode?'Termo atualizado com sucesso.':'Rafael Gonçalves foi notificado para aprovar.')+'</p><div style="display:flex;gap:9px;justify-content:center"><button class="btn bp" data-did="'+did+'" onclick="G.pid=this.dataset.did;re()">👁 Visualizar</button><button class="btn bp" data-did="'+did+'" onclick="gerarPDF(this.dataset.did)">⬇ Salvar PDF</button><button class="btn bs" onclick="if(G.nf)G.nf=null;go(\'tl\')">Ver Todos</button></div></div>';
  }
  var STEPS=['Informações','Veículos Vendidos','Veículos de Troca','Pagamento'];
  var s=G.ns, f=G.nf;
  var html='<div style="max-width:700px"><h1 style="font-family:var(--s);font-size:22px;margin-bottom:20px">'+(f.editMode?'Editar Termo — '+f.editId:'Nova Venda')+'</h1>';
  html+='<div class="steps">';
  for(var i=0;i<STEPS.length;i++){
    var cls=i<s?'sdn':i===s?'sac':'std';
    html+='<div class="si"><div class="sd '+cls+'">'+(i<s?'✓':i+1)+'</div><div style="font-size:11px;margin-left:5px;font-weight:600;color:'+(i===s?'var(--tx)':'var(--tx3)')+'">'+STEPS[i]+'</div>';
    if(i<STEPS.length-1) html+='<div class="sl'+(i<s?' sldo':'')+'"></div>';
    html+='</div>';
  }
  html+='</div><div class="card">';
  if(s===0) html+=bS0(f);
  else if(s===1) html+=bS1(f);
  else if(s===2) html+=bS2(f);
  else html+=bS3(f);
  html+='<hr class="dv"><div style="display:flex;justify-content:space-between">';
  html+=s>0?'<button class="btn bs" onclick="G.ns--;re()">← Anterior</button>':'<button class="btn bg" onclick="if(G.nf)G.nf=null;go(\'tl\')">Cancelar</button>';
  html+=s<3?'<button class="btn bp" onclick="nS()">Próximo →</button>':'<button class="btn bok" onclick="sT()">'+(f.editMode?'💾 Salvar Alterações':'✓ Enviar para Aprovação')+'</button>';
  html+='</div></div></div>';
  return html;
}

function gerarPDF(id){
  var t=G.T.find(function(x){return x.id===id;});
  if(!t){alert('Termo não encontrado');return;}
  var cr=G.U.find(function(u){return u.id===t.cr;});
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  var W=210,M=14,y=0;
  function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function sf(st,sz,col){doc.setFont('helvetica',st);doc.setFontSize(sz);var c=h2r(col||'#1a1814');doc.setTextColor(c[0],c[1],c[2]);}
  function fr(x,fy,w,h,col){var c=h2r(col);doc.setFillColor(c[0],c[1],c[2]);doc.rect(x,fy,w,h,'F');}
  function dl(x1,y1,x2,y2,col,lw){var c=h2r(col||'#e0e0e0');doc.setDrawColor(c[0],c[1],c[2]);doc.setLineWidth(lw||0.2);doc.line(x1,y1,x2,y2);}
  function fmtDt(d){ if(!d) return '—'; var p=d.split('/'); return p.length===3?p[0]+'/'+p[1]+'/'+p[2].slice(-2):d; }
  function fmtPh(p){ if(!p) return '—'; var d=p.replace(/\D/g,''); if(d.length===11) return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7); if(d.length===10) return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6); return p; }
  function campo(label,valor,x,fy,w){sf('bold',8,'#888888');doc.text(label,x,fy);sf('normal',10,'#1a1814');doc.text(String(valor||'—'),x,fy+4.5,{maxWidth:w-1});dl(x,fy+6.2,x+w,fy+6.2,'#e0e0e0',0.15);}
  function campoDir(label,valor,x,fy,w){sf('bold',8,'#888888');doc.text(label,x+w,fy,{align:'right'});sf('bold',12,'#e8431e');doc.text(String(valor||'—'),x+w,fy+5,{align:'right'});dl(x,fy+6.5,x+w,fy+6.5,'#e0e0e0',0.15);}
  function lc(campos,fy){for(var i=0;i<campos.length;i++){var c=campos[i];if(c.dir) campoDir(c.l,c.v,c.x,fy,c.w);else campo(c.l,c.v,c.x,fy,c.w);}return fy+12;}
  function secao(titulo,cor){fr(M,y,W-M*2,7,'#e8e8e8');sf('bold',9,'#444444');doc.text(titulo,W/2,y+5,{align:'center'});y+=10;}
  // Header
  fr(0,0,W,28,'#e0e0e0');
  try{doc.addImage(LOGO,'PNG',M,3,0,22);}catch(e){}
  sf('bold',20,'#333333');doc.text('TERMO DE VENDA',W/2,10,{align:'center'});sf('bold',9,'#333333');doc.text(t.tp||'VENDA FINAL',W/2,16,{align:'center'});
  sf('normal',9,'#666666');doc.text('Data: '+fmtDt(t.dt),W-M,8,{align:'right'});doc.text('Origem: '+t.og,W-M,14,{align:'right'});
  y=34;
  var tw=W-M*2;
  secao('DADOS DO COMPRADOR','#1e4d8c');
  y=lc([{l:'Comprador',v:t.by,x:M,w:tw/2-2},{l:'Telefone',v:fmtPh(t.ph),x:M+tw/2+2,w:tw/2-2}],y);y+=4;
  for(var i=0;i<t.sv.length;i++){
    var v=t.sv[i];
    secao('VEÍCULO VENDIDO'+(t.sv.length>1?' '+(i+1):''));
    y=lc([{l:'Modelo / Marca',v:v.m,x:M,w:tw*.40},{l:'Ano Fab./Mod.',v:v.yf+'/'+v.ym,x:M+tw*.42,w:tw*.16},{l:'Cor',v:v.c,x:M+tw*.60,w:tw*.16},{l:'Valor de Venda',v:fmtR(v.pr),x:M+tw*.78,w:tw*.22,dir:true}],y);
    y=lc([{l:'Quilometragem',v:v.km,x:M,w:tw*.35},{l:'Placa',v:v.pl,x:M+tw*.37,w:tw*.63}],y);
    sf('normal',9,'#1a1814');doc.text('IPVA 2026: ('+(v.ip==='comprador'?'X':' ')+') Comprador   ('+(v.ip==='rtcar'?'X':' ')+') RT Car',M,y);
    doc.text('Transferência: ('+(v.tr==='comprador'?'X':' ')+') Comprador   ('+(v.tr==='rtcar'?'X':' ')+') RT Car',M+90,y);y+=8;
  }
  for(var i=0;i<t.tv.length;i++){
    var v=t.tv[i];
    secao('VEÍCULO DE TROCA'+(t.tv.length>1?' '+(i+1):''),'#1e4d8c');
    y=lc([{l:'Modelo / Marca',v:v.m,x:M,w:tw*.40},{l:'Ano Fab./Mod.',v:v.yf+'/'+v.ym,x:M+tw*.42,w:tw*.16},{l:'Cor',v:v.c,x:M+tw*.60,w:tw*.16},{l:'Valor de Entrada',v:fmtR(v.v),x:M+tw*.78,w:tw*.22,dir:true}],y);
    y=lc([{l:'Quilometragem',v:v.km,x:M,w:tw*.28},{l:'Placa',v:v.pl,x:M+tw*.30,w:tw*.22},{l:'Chave Reserva',v:v.cr==='sim'?'Sim':'Não',x:M+tw*.54,w:tw*.46}],y);
    y=lc([{l:'Avaliação',v:fmtR(v.av),x:M,w:tw*.35},{l:'Valor Fipe',v:fmtR(v.po),x:M+tw*.37,w:tw*.63}],y);
    if(v.fi||v.bk) y=lc([{l:'Banco Alienação',v:v.fi||'—',x:M,w:tw*.45},{l:'Valor Quitação',v:fmtR(v.bk),x:M+tw*.47,w:tw*.53}],y);
    if(v.obs) y=lc([{l:'Observações',v:v.obs,x:M,w:tw}],y);
    sf('normal',9,'#1a1814');doc.text('IPVA 2026: ('+(v.ip==='comprador'?'X':' ')+') Comprador   ('+(v.ip==='rtcar'?'X':' ')+') RT Car',M,y);y+=8;
  }
  secao('FORMAS DE PAGAMENTO','#1a6b3c');
  if(t.py.vo) y=lc([{l:'Valor da Volta / Pagamento',v:fmtR(t.py.vo),x:M+tw*.62,w:tw*.38,dir:true}],y);
  if(t.py.formas&&t.py.formas.length>0){sf('normal',9,'#1a1814');doc.text('Formas: '+t.py.formas.join(', '),M,y);y+=7;}
  if(t.py.obs){
    sf('bold',8,'#888888');doc.text('NEGOCIAÇÃO / DETALHES',M,y);
    sf('normal',10,'#1a1814');
    var obsLines=doc.splitTextToSize(t.py.obs,tw);
    for(var ol=0;ol<obsLines.length;ol++){doc.text(obsLines[ol],M,y+4.5+(ol*5.5));}
    dl(M,y+5.5+(obsLines.length*5.5),M+tw,y+5.5+(obsLines.length*5.5),'#e0e0e0',0.15);
    y+=8+(obsLines.length*5.5);
  }
  if(t.py.hf){
    var w3=tw/3-2;
    y=lc([{l:'Banco',v:t.py.fb,x:M,w:w3},{l:'Valor Financiado',v:fmtR(t.py.fv),x:M+w3+3,w:w3},{l:'Parcelas',v:t.py.fp+'x de '+fmtR(t.py.fpv),x:M+(w3+3)*2,w:w3}],y);
    y=lc([{l:'Tabela',v:t.py.ft,x:M,w:w3},{l:'Vencimento 1ª Parcela',v:t.py.fvc,x:M+w3+3,w:w3}],y);
  }
  y+=4;
  if(t.st==='approved'){fr(M,y,tw,8,'#e8f5ee');var gc=h2r('#1a6b3c');doc.setDrawColor(gc[0],gc[1],gc[2]);doc.setLineWidth(0.3);doc.rect(M,y,tw,8,'S');sf('bold',8,'#1a6b3c');doc.text('✓ Aprovado por Rafael Gonçalves em '+(t.at||'—'),M+3,y+5.5);y+=12;}
  if(y>242){doc.addPage();y=20;}
  y=Math.max(y,238);
  dl(M,y,W-M,y,'#e0e0e0',0.3);y+=8;
  var sw=tw/3;
  var sigs=['RT Car Comércio de Veículos','Comprador(a): '+t.by,'Vendedor(a): '+(cr?cr.n:'—')];
  for(var i=0;i<sigs.length;i++){
    var x=M+sw*i+sw/2;
    dl(x-26,y+18,x+26,y+18,'#1a1814',0.4);
    sf('normal',7,'#8a867e');doc.text(sigs[i],x,y+23,{align:'center',maxWidth:sw-4});
  }
  var pages=doc.getNumberOfPages();
  for(var i=1;i<=pages;i++){doc.setPage(i);fr(0,287,W,10,'#e0e0e0');sf('normal',7,'#666666');doc.text('RT Car Comércio de Veículos  |  Documento gerado em '+ts(),W/2,293,{align:'center'});}
  doc.save('Termo_Venda_'+t.id+'.pdf');
}
