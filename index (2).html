<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RT Car — Gestão de Vendas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f8f8;--bg2:#ffffff;--bg3:#f2f4f6;
  --tx:#1a1814;--tx2:#4a4a4a;--tx3:#888;
  --red:#e8431e;--redl:#fff0ec;
  --gold:#b8860b;--goldl:#faf6e8;
  --green:#1a6b3c;--greenl:#e8f5ee;
  --blue:#1e4d8c;--bluel:#e8f0fb;
  --bdr:#e2e2e2;--bdr2:#ccc;
  --r:10px;--r2:14px;
  --f:'DM Sans',sans-serif;--s:'DM Serif Display',serif
}
body{font-family:var(--f);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;height:100vh;overflow:hidden}
.wrap{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR — light */
.sb{width:220px;background:#fff;border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0}
.logo-area{padding:18px 20px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px}
.logo-area img{width:80px;object-fit:contain}
.logo-sub{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
.nav{flex:1;padding:10px 0}
.ni{display:flex;align-items:center;gap:9px;padding:10px 20px;cursor:pointer;color:var(--tx2);font-size:13px;border-left:3px solid transparent;transition:all .12s;border-radius:0 8px 8px 0;margin:1px 8px 1px 0}
.ni:hover{color:var(--red);background:#fff3f0}
.ni.on{color:var(--red);background:#fff3f0;border-left-color:var(--red);font-weight:600}
.sb-foot{padding:14px 18px;border-top:1px solid var(--bdr)}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
.tb{background:#fff;border-bottom:1px solid var(--bdr);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cnt{flex:1;overflow-y:auto;padding:24px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:var(--f);transition:all .12s;line-height:1}
.bp{background:var(--red);color:#fff}.bp:hover{background:#c73516}
.bs{background:#fff;color:var(--tx);border:1px solid var(--bdr)}.bs:hover{background:var(--bg3)}
.bg{background:none;color:var(--tx2);border:1px solid transparent}.bg:hover{background:var(--bg3)}
.bok{background:var(--greenl);color:var(--green);border:1px solid rgba(26,107,60,.2)}.bok:hover{background:var(--green);color:#fff}
.bno{background:var(--redl);color:var(--red);border:1px solid rgba(232,67,30,.2)}.bno:hover{background:var(--red);color:#fff}
.bsm{padding:5px 11px;font-size:12px}.bxs{padding:2px 8px;font-size:11px}
.nb{position:relative;background:#fff;border:1px solid var(--bdr);border-radius:var(--r);padding:6px 10px;cursor:pointer;font-size:15px;color:var(--tx2)}
.ndot{position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid #fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600}
.bpp{background:var(--goldl);color:var(--gold)}.baa{background:var(--greenl);color:var(--green)}.brr{background:var(--redl);color:var(--red)}.bdd{background:var(--bg3);color:var(--tx3)}
.badm{background:#1a1814;color:#fff}.bman{background:var(--bluel);color:var(--blue)}.bsel{background:var(--bg3);color:var(--tx2)}
/* CARDS */
.card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.mts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.mt{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:18px;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.mt::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px;border-radius:var(--r2) var(--r2) 0 0}
.mt.bl::after{background:var(--blue)}.mt.gr::after{background:var(--green)}.mt.go::after{background:var(--gold)}.mt.re::after{background:var(--red)}
/* TABLE */
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;padding:9px 14px;text-align:left;background:var(--bg3);border-bottom:1px solid var(--bdr)}
td{padding:11px 14px;border-bottom:1px solid var(--bdr);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.cr:hover td{background:#fff8f6;cursor:pointer}
code{font-size:11px;background:var(--bg3);padding:2px 6px;border-radius:4px;font-family:monospace;color:var(--red)}
/* FORM */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:5px}
.fl label{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px}
.fl input,.fl select,.fl textarea{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:9px 11px;font-size:13px;font-family:var(--f);color:var(--tx);outline:none;transition:border-color .12s;text-transform:uppercase}
.fl input::placeholder,.fl textarea::placeholder{text-transform:none;color:var(--tx3)}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(232,67,30,.08);background:#fff}
.fl input.er,.fl select.er{border-color:var(--red);background:#fff8f6}
.fl textarea{resize:vertical;min-height:70px;text-transform:uppercase}
.fl select{text-transform:none}
.rg{display:flex;gap:12px;flex-wrap:wrap}
.ro{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:13px;color:var(--tx2)}
.ro input{accent-color:var(--red)}
.req{color:var(--red);font-size:10px}
hr.dv{border:none;border-top:1px solid var(--bdr);margin:20px 0}
/* ALERTS */
.al{border-radius:var(--r);padding:11px 14px;font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:9px}
.aw{background:#fffbeb;border:1px solid rgba(184,134,11,.25);color:#7a5a00}
.ai{background:var(--bluel);border:1px solid rgba(30,77,140,.2);color:var(--blue)}
.aok{background:var(--greenl);border:1px solid rgba(26,107,60,.2);color:var(--green)}
/* MONEY */
.mwrap{position:relative}
.mwrap span.msym{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--tx3);pointer-events:none;font-weight:500}
.mwrap input{padding-left:32px!important}
/* PANELS */
.np{position:absolute;right:0;top:0;width:340px;height:100%;background:#fff;border-left:1px solid var(--bdr);z-index:200;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.08)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:#fff;border-radius:var(--r2);padding:26px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.15)}
/* PDF */
.pov{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:300;overflow-y:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.pfr{background:#fff;width:720px;max-width:100%;border-radius:8px;overflow:hidden}
/* ATIVO/TROCA BLOCKS */
.sec-block{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:14px}
.sec-block-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sec-block-title .dot{width:8px;height:8px;border-radius:50%}
.dg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.df{display:flex;flex-direction:column;gap:2px}
.dfl{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);font-weight:600}
.dfv{font-size:13px;font-weight:500;color:var(--tx)}
.dfv.big{font-size:15px;font-weight:700;color:var(--red)}
/* PRICE ALIGNED RIGHT */
.price-right{text-align:right;font-size:15px;font-weight:700;color:var(--red)}
/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:18px}
.tab{padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{color:var(--tx)}.tab.on{color:var(--red);border-bottom-color:var(--red)}
/* STEPS */
.steps{display:flex;align-items:center;margin-bottom:22px}
.si{display:flex;align-items:center;flex:1}
.sd{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.sdn{background:var(--green);color:#fff}.sac{background:var(--red);color:#fff}.std{background:var(--bg3);color:var(--tx3)}
.sl{flex:1;height:1px;background:var(--bdr);margin:0 6px}.sldo{background:var(--green)}
/* VC */
.vc{background:#fff;border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.vch{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.add{display:flex;align-items:center;gap:6px;padding:9px 14px;border:1px dashed var(--bdr2);border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--tx2);background:none;font-family:var(--f);width:100%;margin-top:6px;transition:all .12s;justify-content:center}
.add:hover{border-color:var(--red);color:var(--red);background:var(--redl)}
/* TIMELINE */
.tli{display:flex;gap:10px;padding-bottom:14px;position:relative}
.tli:not(:last-child)::after{content:'';position:absolute;left:10px;top:22px;width:1px;height:calc(100% - 6px);background:var(--bdr)}
.tld{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;z-index:1;flex-shrink:0}
/* LOGIN */
.lw{display:flex;min-height:100vh;width:100%}
.ll{flex:1;background:#1a1814;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.lr{width:420px;display:flex;align-items:center;justify-content:center;padding:36px;background:var(--bg)}
.lc{width:100%;max-width:340px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
</style>
</head>

function onMoney(el,path){
  const raw=el.value.replace(/\D/g,'');

  const cents=parseInt(raw,10);
  const fmt=(cents/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  el.value=fmt;
  setPath(path,fmt);
}
function setPath(path,val){

    obj=obj[parts[i]];
  }
  obj[parts[parts.length-1]]=val;
}

// EDITAR TERMO
function startEdit(id){
  const t=G.T.find(x=>x.id===id);
  if(!t||t.locked){alert('Este termo foi aprovado e não pode ser editado.');return;}
  G.nf=JSON.parse(JSON.stringify(t));
  G.nf.editMode=true;G.nf.editId=id;
  G.nf.dn=false;G.ns=0;
  go('nv');
}
function saveEdit(){
  const f=G.nf;
  const idx=G.T.findIndex(x=>x.id===f.editId);
  if(idx<0)return;
  const orig=G.T[idx];
  G.T[idx]={...orig,...f,editMode:false,editId:undefined,lg:[...orig.lg,{a:'Termo editado',u:G.u.n,t:ts()}]};
  G.nf=null;G.ns=0;
  go('dt',orig.id);
}

// PDF REAL
function gerarPDF(id){
  const t=G.T.find(x=>x.id===id);if(!t){alert('Termo não encontrado');return;}
  const cr=G.U.find(u=>u.id===t.cr);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,M=14;let y=0;
  const h2r=h=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return[r,g,b];};
  const sf=(st,sz,col)=>{doc.setFont('helvetica',st);doc.setFontSize(sz);const[r,g,b]=h2r(col||'#1a1814');doc.setTextColor(r,g,b);};
  const fr=(x,fy,w,h,col)=>{const[r,g,b]=h2r(col);doc.setFillColor(r,g,b);doc.rect(x,fy,w,h,'F');};
  const dl=(x1,y1,x2,y2,col,lw)=>{doc.setDrawColor(...h2r(col||'#e2e2e2'));doc.setLineWidth(lw||0.2);doc.line(x1,y1,x2,y2);};
  const campo=(label,valor,x,fy,w)=>{sf('bold',7,'#888888');doc.text(label,x,fy);sf('normal',9,'#1a1814');doc.text(String(valor||'—'),x,fy+4.5,{maxWidth:w-1});dl(x,fy+6.2,x+w,fy+6.2,'#e2e2e2',0.15);};
  const campoDir=(label,valor,x,fy,w)=>{sf('bold',7,'#888888');doc.text(label,x+w,fy,{align:'right'});sf('bold',10,'#e8431e');doc.text(String(valor||'—'),x+w,fy+5,{align:'right'});dl(x,fy+6.5,x+w,fy+6.5,'#e2e2e2',0.15);};
  const lc=(campos,fy)=>{campos.forEach(c=>c.dir?campoDir(c.l,c.v,c.x,fy,c.w):campo(c.l,c.v,c.x,fy,c.w));return fy+10;};
  const secao=(titulo,cor)=>{fr(M,y,W-M*2,7,cor||'#e8431e');sf('bold',8,'#ffffff');doc.text(titulo,M+3,y+5);y+=10;};
  // HEADER com logo
  fr(0,0,W,28,'#1a1814');
  try{doc.addImage(LOGO_B64,'PNG',M,4,32,20);}catch(e){}
  sf('bold',14,'#ffffff');doc.text('TERMO DE VENDA',W/2,12,{align:'center'});
  sf('normal',8,'#cccccc');doc.text(`Nº ${t.id}`,W-M,8,{align:'right'});doc.text(`Data: ${t.dt}`,W-M,13,{align:'right'});doc.text(`Origem: ${t.og||'—'}`,W-M,18,{align:'right'});
  y=34;
  // COMPRADOR
  secao('DADOS DO COMPRADOR','#1e4d8c');
  const cw=(W-M*2)/2;
  y=lc([{l:'Comprador',v:t.by,x:M,w:cw-2},{l:'Telefone',v:t.ph,x:M+cw+2,w:cw-2}],y);y+=4;
  // VEÍCULOS VENDIDOS
  t.sv.forEach((v,i)=>{
    secao('VEÍCULO VENDIDO'+(t.sv.length>1?' '+(i+1):''));
    const tw=W-M*2,col1=tw*0.65,col2=tw*0.35;
    y=lc([{l:'Modelo / Marca',v:v.m,x:M,w:tw*.44},{l:'Ano Fab./Mod.',v:v.yf+'/'+v.ym,x:M+tw*.46,w:tw*.2},{l:'Cor',v:v.c,x:M+tw*.68,w:tw*.32}],y);
    y=lc([{l:'Quilometragem',v:v.km,x:M,w:tw*.3},{l:'Placa',v:v.pl,x:M+tw*.32,w:tw*.28},{l:'Valor de Venda',v:fmtR(v.pr),x:M+tw*.62,w:tw*.38,dir:true}],y);
    sf('normal',8,'#1a1814');doc.text(`IPVA 2026: (${v.ip==='comprador'?'X':' '}) Comprador   (${v.ip==='rtcar'?'X':' '}) RT Car`,M,y);doc.text(`Transferência: (${v.tr==='comprador'?'X':' '}) Comprador   (${v.tr==='rtcar'?'X':' '}) RT Car`,M+90,y);y+=8;
  });
  // VEÍCULOS TROCA
  t.tv.forEach((v,i)=>{
    secao('VEÍCULO DE TROCA'+(t.tv.length>1?' '+(i+1):''),'#1e4d8c');
    const tw=W-M*2;
    y=lc([{l:'Modelo / Marca',v:v.m,x:M,w:tw*.44},{l:'Ano Fab./Mod.',v:v.yf+'/'+v.ym,x:M+tw*.46,w:tw*.2},{l:'Cor',v:v.c,x:M+tw*.68,w:tw*.32}],y);
    y=lc([{l:'Quilometragem',v:v.km,x:M,w:tw*.25},{l:'Placa',v:v.pl,x:M+tw*.27,w:tw*.22},{l:'Chave Reserva',v:v.cr==='sim'?'Sim':'Não',x:M+tw*.51,w:tw*.2},{l:'Valor de Entrada',v:fmtR(v.v),x:M+tw*.73,w:tw*.27,dir:true}],y);
    y=lc([{l:'Valor Fipe',v:fmtR(v.fi),x:M,w:tw*.3},{l:'Valor Avaliação',v:fmtR(v.av),x:M+tw*.32,w:tw*.3},{l:'Banco (Alienação)',v:v.bk||'—',x:M+tw*.64,w:tw*.36}],y);
    if(v.po){y=lc([{l:'Valor Quitação',v:fmtR(v.po),x:M,w:tw*.3}],y);}
    if(v.obs){y=lc([{l:'Observações',v:v.obs,x:M,w:tw}],y);}
    sf('normal',8,'#1a1814');doc.text(`IPVA 2026: (${v.ip==='comprador'?'X':' '}) Comprador   (${v.ip==='rtcar'?'X':' '}) RT Car`,M,y);y+=8;
  });
  // PAGAMENTO
  secao('FORMAS DE PAGAMENTO','#1a6b3c');
  const tw=W-M*2;
  if(t.py.formas&&t.py.formas.length>0){sf('normal',8,'#1a1814');doc.text('Formas: '+t.py.formas.join(', '),M,y);y+=7;}
  if(t.py.obs){y=lc([{l:'Negociação / Detalhes',v:t.py.obs,x:M,w:tw}],y);}
  if(t.py.vo){y=lc([{l:'Valor da Volta / Pagamento',v:fmtR(t.py.vo),x:M,w:tw*.6,dir:false},{l:'',v:fmtR(t.py.vo),x:M+tw*.62,w:tw*.38,dir:true}],y);}
  if(t.py.hf){const w3=tw/3-2;y=lc([{l:'Banco',v:t.py.fb,x:M,w:w3},{l:'Valor Financiado',v:fmtR(t.py.fv),x:M+w3+3,w:w3},{l:'Parcelas',v:t.py.fp+'x de '+fmtR(t.py.fpv),x:M+(w3+3)*2,w:w3}],y);y=lc([{l:'Taxa',v:t.py.ft,x:M,w:w3},{l:'Vencimento 1ª Parcela',v:t.py.fvc,x:M+w3+3,w:w3}],y);}
  y+=4;
  if(t.st==='approved'){fr(M,y,W-M*2,8,'#e8f5ee');doc.setDrawColor(...h2r('#1a6b3c'));doc.setLineWidth(0.3);doc.rect(M,y,W-M*2,8,'S');sf('bold',8,'#1a6b3c');doc.text(`✓ Aprovado por Rafael Gonçalves em ${t.at||'—'}`,M+3,y+5.5);y+=12;}
  if(y>242){doc.addPage();y=20;}y=Math.max(y,238);
  dl(M,y,W-M,y,'#e2e2e2',0.3);y+=8;
  const sw=(W-M*2)/3;

  re();
}

function nS(){
  const f=G.nf,s=G.ns;
  if(s===0){if(!f.og)return alert('Selecione a Origem.');if(!f.by.trim())return alert('Informe o nome do comprador.');if(!f.ph.trim())return alert('Informe o telefone.');}
  if(s===1){for(let i=0;i<f.sv.length;i++){const v=f.sv[i];if(!v.m||!v.pr||!v.c||!v.km||!v.yf||!v.ym||!v.pl)return alert('Preencha todos os campos do Veículo '+(i+1)+'.');}}
  if(s===2){for(let i=0;i<f.tv.length;i++){if(!f.tv[i].cr)return alert('Informe chave reserva da troca '+(i+1)+'.  ');}}
  if(s===3){if(!f.py.obs||!f.py.obs.trim())return alert('Descreva as condições de pagamento.');}
  G.ns++;re();
}

}

function dD(id,st){
  const obs=($('of')||{}).value||'';
  const t=G.T.find(x=>x.id===id);if(!t)return;
  t.st=st;t.ab=G.u.id;t.at=ts();
  if(st==='approved')t.locked=true;
  t.lg.push({a:(st==='approved'?'Aprovado':'Recusado')+' por '+G.u.n+(obs?' — '+obs:''),u:G.u.n,t:ts()});
  // Notifica TODOS os usuários
  G.U.forEach(u=>{
    if(u.id!==G.u.id){
      G.N.unshift({id:Date.now()+u.id,msg:st==='approved'?`✅ Termo ${id} APROVADO por ${G.u.n} — ${t.by}`:`❌ Termo ${id} recusado por ${G.u.n} — ${t.by}`,t:ts().slice(0,11),r:false,tid:id});
    }
  });
  G.mo=null;re();
}

    <div id="aue" style="display:none;background:var(--redl);border:1px solid rgba(232,67,30,.2);color:var(--red);padding:8px 11px;border-radius:var(--r);font-size:12px;margin-bottom:12px"></div>
    <div class="g2">
      <div class="fl"><label>Nome</label><input value="${af.n}" oninput="G.auF.n=this.value.toUpperCase()" placeholder="ANA SOUZA"></div>
      <div class="fl"><label>E-mail</label><input type="email" value="${af.e}" oninput="G.auF.e=this.value" placeholder="ana@rtcar.com.br" style="text-transform:none"></div>
      <div class="fl"><label>Senha</label><input type="password" value="${af.p}" oninput="G.auF.p=this.value"></div>
      <div class="fl"><label>Perfil</label><select onchange="G.auF.r=this.value">
        <option value="seller"${af.r==='seller'?' selected':''}>Vendedor</option>
        <option value="manager"${af.r==='manager'?' selected':''}>Gestão</option>
        <option value="admin"${af.r==='admin'?' selected':''}>Administrador</option>
      </select></div>
    </div>
    <div style="margin-top:14px"><button class="btn bp" onclick="aU()">+ Adicionar</button></div>
  </div>`:''}
  <div class="card" style="padding:0;overflow:hidden">
    <table><thead><tr><th>Usuário</th><th>E-mail</th><th>Perfil</th></tr></thead>
    <tbody>${G.U.map(u=>`<tr>
      <td><div style="display:flex;align-items:center;gap:10px"><div class="av" style="background:${RC[u.r]||'#888'};width:32px;height:32px;font-size:11px">${ini(u.n)}</div><span style="font-weight:600">${u.n}</span></div></td>
      <td style="color:var(--tx2);font-size:12px">${u.e}</td>
      <td><span class="bdg b${u.r==='admin'?'adm':u.r==='manager'?'man':'sel'}">${RL[u.r]||u.r}</span></td>
    </tr>`).join('')}</tbody></table>
  </div>
</div>`;}
function aU(){const f=G.auF,e=$('aue');if(!f.n||!f.e||!f.p){e.textContent='Preencha todos os campos.';e.style.display='block';return;}if(G.U.find(u=>u.e===f.e)){e.textContent='E-mail já cadastrado.';e.style.display='block';return;}G.U.push({id:Date.now(),n:f.n,e:f.e,p:f.p,r:f.r});G.auF={n:'',e:'',p:'',r:'seller'};G.auO=false;re();}

// PERFIL
function bPR(){const u=G.u;return`<div style="max-width:400px">
  <h1 style="font-family:var(--s);font-size:22px;margin-bottom:20px">Meu Perfil</h1>
  <div class="card">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
      <div class="av" style="background:${RC[u.r]||'#888'};width:56px;height:56px;font-size:18px;border-radius:50%">${ini(u.n)}</div>
      <div><div style="font-size:17px;font-weight:700">${u.n}</div><div style="font-size:12px;color:var(--tx3);margin-top:2px">${u.e}</div><span class="bdg b${u.r==='admin'?'adm':u.r==='manager'?'man':'sel'}" style="margin-top:6px;display:inline-flex">${RL[u.r]}</span></div>
    </div>
    <div class="al ai">ℹ Para alterar senha ou e-mail, contate o administrador.</div>
  </div>
</div>`;}

function bi(){
  const lb=$('lbt');
  if(lb){lb.onclick=dL;['lem','lpw'].forEach(id=>{const el=$(id);if(el)el.onkeydown=e=>{if(e.key==='Enter')dL();};});}
}
re();
</script>
